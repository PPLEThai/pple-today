name: Mobile Beta Deployment

on:
  workflow_call:
    inputs:
      android:
        type: string
        description: 'Build Android app'
      ios:
        type: string
        description: 'Build iOS app'
      groups:
        type: string
        description: 'Distribute to (comma-separated)'
      environment:
        type: string
        description: 'Deployment environment'

jobs:
  build-android:
    name: Build Android
    runs-on: macos-latest
    environment: ${{ inputs.environment }}
    if: ${{ inputs.android == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22.14.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # - name: Validate Gradle wrapper
      #   uses: gradle/wrapper-validation-action@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Environment File
        working-directory: apps-client/mobile
        env:
          ${{ insert }}: ${{ secrets }}
          APP_ENVIRONMENT: ${{ inputs.environment }}
          EXPO_PUBLIC_APP_ENVIRONMENT: ${{ inputs.environment }}
          DISTRIBUTE_GROUPS: ${{ inputs.groups }}
        run: |
          bash ./scripts/setup-credentials.sh
          node ./scripts/write-ci-env.mjs

      - name: Prebuild Android
        working-directory: apps-client/mobile
        run: npx expo prebuild --platform android

      - name: Install Fastlane
        working-directory: apps-client/mobile
        shell: bash
        env:
          ${{ insert }}: ${{ secrets }}
          CI: true
        run: |
          bash ./fastlane/setup.sh
          cd android && bundle install

      - name: Build Android App via fastlane
        working-directory: apps-client/mobile/android
        run: fastlane beta
        env:
          CI: true
          CD: true

  build-ios:
    name: Build iOS
    runs-on: macos-26
    environment: ${{ inputs.environment }}
    if: ${{ inputs.ios == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22.14.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Environment File
        working-directory: apps-client/mobile
        env:
          ${{ insert }}: ${{ secrets }}
          APP_ENVIRONMENT: ${{ inputs.environment }}
          EXPO_PUBLIC_APP_ENVIRONMENT: ${{ inputs.environment }}
          DISTRIBUTE_GROUPS: ${{ inputs.groups }}
        run: |
          bash ./scripts/setup-credentials.sh
          node ./scripts/write-ci-env.mjs

      - name: Prebuild iOS
        working-directory: apps-client/mobile
        run: npx expo prebuild --platform ios

      # Note: Required due to Swift linker problem
      # See https://github.com/invertase/react-native-firebase/issues/8702#issuecomment-3843214625
      - name: Set Xcode Toolchain
        shell: bash
        run: |
          echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> $GITHUB_ENV

      # Expo SDK 58 needs Xcode 26.4 or later. The Xcode 26.4 release-build crash
      # that kept this on 26.3 (invertase/react-native-firebase#8949) was fixed in the
      # Firebase Apple SDK that React Native Firebase 27 ships.
      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/Xcode_26.4.app/Contents/Developer'

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - name: Install pods
        working-directory: apps-client/mobile
        run: cd ios && pod install --repo-update

      - name: Install Fastlane
        working-directory: apps-client/mobile
        shell: bash
        env:
          ${{ insert }}: ${{ secrets }}
          CI: true
        run: |
          bash ./fastlane/setup.sh
          cd ios && bundle install

      - name: Build iOS App via fastlane
        working-directory: apps-client/mobile/ios
        run: fastlane beta
        env:
          CI: true
          CD: true

      # Never `cat` the gym log: this repo's Actions logs are public, and xcodebuild
      # writes the whole build environment (fastlane loads every secret into it) as
      # `export NAME=value` lines before each script phase. Print diagnostics only.
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          echo "Installed Xcode versions:"; ls -d /Applications/Xcode*.app
          log=$(ls -t ~/Library/Logs/gym/*.log 2>/dev/null | head -1)
          if [ -z "$log" ]; then echo "No gym log found."; exit 0; fi
          grep -v -E '^[[:space:]]*(export|setenv) ' "$log" \
            | grep -E -B8 '(^|[[:space:]])(error|fatal error):|Command [A-Za-z]+ failed|\*\* (ARCHIVE|BUILD) FAILED' \
            | grep -v -E '^[[:space:]]*(cd|/bin/sh -c|builtin-|/usr/bin/env) ' \
            | cut -c1-400 | head -150
