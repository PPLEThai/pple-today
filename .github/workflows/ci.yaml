name: Continuous Integration
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 40

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v3
        name: Checkout
        with:
          fetch-depth: 0

      - name: Setup GitHub Actions caching for Turbo
        uses: rharkor/caching-for-turbo@v1.8

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Setup node with cache
        uses: actions/setup-node@v3
        with:
          node-version: 22.14.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get turbo filter
        id: get-turbo-filter
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TURBO_FILTER="--filter=...[origin/${{ github.base_ref }}]"
            echo "This is a pull request event. Setting turbo filter to '$TURBO_FILTER'"
          elif [ "${{ github.event_name }}" == "push" ]; then
            TURBO_FILTER="--filter=...[${{ github.event.before }}]"
            echo "This is a push event. Setting turbo filter to '$TURBO_FILTER'"
          else
            echo "Unsupported event '${{ github.event_name }}' detected. Exiting."
            exit 1
          fi

          echo "TURBO_FILTER=$TURBO_FILTER" >> $GITHUB_OUTPUT

      - name: Run script generate
        run: bun run turbo codegen

      - name: Run Test
        run: bun run turbo test ${{ steps.get-turbo-filter.outputs.TURBO_FILTER }}

      - name: Run Type Check, Format Check
        run: bun run turbo typecheck format:check lint ${{ steps.get-turbo-filter.outputs.TURBO_FILTER }}

      - name: Setup Environment File
        working-directory: apps-client/mobile
        shell: bash
        env: ${{ secrets }}
        run: |
          bash ./scripts/setup-credentials.sh
          env > .env

      - name: Run Prebuild
        run: bun run turbo prebuild ${{ steps.get-turbo-filter.outputs.TURBO_FILTER }}
